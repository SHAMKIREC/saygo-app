<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08101f">
<title>SAYGO — разговорный английский</title>
<style>
:root{--bg:#08101f;--panel:#101c31;--panel2:#14233b;--line:#314663;--text:#f4f7fc;--muted:#a8b5ca;--lime:#c7ff00;--lime2:#e7ff80;--danger:#ff7587;--good:#5ce0a0}*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 85% -10%,#1a3e72 0,transparent 34rem),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100%}button{font:inherit}button:enabled{cursor:pointer}.app{width:min(100%,620px);margin:0 auto;padding:18px 16px calc(104px + env(safe-area-inset-bottom));min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.1em}.mark{height:39px;width:39px;border:1px solid var(--lime);border-radius:13px;display:grid;place-items:center;color:var(--lime);font-size:22px}.release{color:var(--muted);font-size:12px;border:1px solid var(--line);padding:8px 10px;border-radius:11px}.eyebrow{display:flex;align-items:center;gap:8px;color:var(--lime);font-size:12px;letter-spacing:.13em;font-weight:900}.dot{height:8px;width:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 15px var(--lime)}h1{font-size:clamp(38px,11vw,56px);line-height:.96;letter-spacing:-.065em;margin:15px 0 18px}h2{font-size:clamp(28px,8vw,37px);letter-spacing:-.055em;line-height:1.02;margin:7px 0 10px}h3{font-size:17px;margin:0 0 9px}p{margin:0;color:var(--muted);line-height:1.52}.hero{padding:9px 0 20px}.intro{font-size:18px;max-width:32ch}.card,.summary,.module,.exam{background:linear-gradient(135deg,var(--panel2),var(--panel) 74%);border:1px solid var(--line);border-radius:24px;padding:20px;margin-top:16px;box-shadow:0 16px 40px #0003}.summary{padding:17px}.row{display:flex;align-items:center;justify-content:space-between;gap:11px}.muted{color:var(--muted)}.small{font-size:13px}.bar{height:10px;background:#263a59;border-radius:100px;overflow:hidden;margin:12px 0 9px}.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--lime),var(--lime2));transition:width .3s ease}.lesson-meta{font-size:12px;font-weight:900;color:var(--lime);letter-spacing:.11em}.lesson-position{font-size:13px;color:var(--muted);margin-top:6px}.chip{border:1px solid #496181;color:#ced9eb;border-radius:12px;padding:8px 10px;white-space:nowrap;font-weight:800;font-size:12px}.material-label{margin-top:18px;color:var(--lime);font-size:11px;font-weight:900;letter-spacing:.12em}.english{font-size:clamp(30px,9vw,45px);font-weight:900;letter-spacing:-.055em;line-height:1.07;margin:7px 0 8px;overflow-wrap:anywhere}.meaning{font-size:19px}.pronounce{margin-top:7px;color:#d8e1ee;font-weight:650;font-size:15px}.sound-card{margin-top:12px;padding:13px;border:1px solid #2b405f;border-radius:14px;background:#0c1728}.sound-card b{font-size:18px}.sound-meaning{margin-top:3px;font-size:13px;color:var(--muted)}.sound-options{display:grid;gap:7px;margin-top:10px}.sound-option{border:1px solid #3b5171;background:#111d31;color:var(--text);border-radius:11px;padding:11px;text-align:left;font-weight:750}.sound-option.selected{border-color:var(--lime);box-shadow:inset 0 0 0 1px var(--lime);color:var(--lime)}.why,.rule{margin-top:16px;padding:14px 15px;border-radius:16px;background:#0b1525;border:1px solid #293e5e}.why b,.rule b{display:block;color:var(--text);margin-bottom:4px}.rule{border-left:3px solid var(--lime)}.tip{margin-top:11px;font-size:14px}.btn{appearance:none;width:100%;border:1px solid #46607f;border-radius:16px;background:#122037;color:var(--text);font-weight:850;padding:16px;text-align:center;min-height:54px}.btn:disabled{opacity:.4}.btn.primary{border:0;background:var(--lime);color:#10170b;box-shadow:0 10px 26px #c7ff0035}.btn.danger{border-color:#8b4d61;color:#ffdce2}.btn+.btn{margin-top:9px}.lesson-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:15px 0}.step{font-size:11px;line-height:1.2;text-align:center;padding:9px 4px;border-radius:11px;background:#0c1728;border:1px solid #2b405f;color:var(--muted)}.step.done{color:#122008;background:var(--lime);border-color:var(--lime);font-weight:850}.state{margin:11px 0 0;padding:13px;border-radius:14px;background:#0a1627;border:1px solid #2c4160;font-size:14px}.state.good{border-color:#4aa778;background:#10291f}.state.bad{border-color:#a65466;background:#2c1720}.practice{padding-top:17px;margin-top:17px;border-top:1px solid #2d405e}.choices{display:grid;gap:8px;margin-top:11px}.choice{width:100%;text-align:left;border:1px solid #3b5171;background:#111d31;color:var(--text);padding:13px;border-radius:13px}.choice.correct{border-color:#58b47a;background:#122b20}.choice.wrong{border-color:#b35b6d;background:#2c1720}.word-bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.word{background:#1b2d47;color:#f3f8ff;border:1px solid #4a6385;padding:10px 12px;border-radius:11px;font-weight:800}.built{min-height:48px;padding:12px;border:1px dashed #60789f;border-radius:13px;color:#d6dfef;margin-top:11px}.built.empty{color:#8fa0b9}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.lesson-done{margin-top:16px;padding:15px;border-radius:16px;background:#10281e;border:1px solid #4da970}.lesson-done b{display:block;margin-bottom:4px}.lesson-nav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.course-head{margin:4px 0 20px}.module{padding:14px 15px;border-radius:17px;margin-top:22px;background:#0d1829}.module b{display:block;font-size:13px;letter-spacing:.08em;color:var(--lime)}.module span{font-size:13px;color:var(--muted);display:block;margin-top:4px}.lesson-row{width:100%;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:19px;padding:15px;background:#111d31;color:var(--text);margin-top:10px}.number{width:48px;height:48px;display:grid;place-items:center;background:#243755;border-radius:14px;font-size:19px}.lesson-copy{min-width:0}.lesson-copy strong,.lesson-copy span{display:block}.lesson-copy strong{line-height:1.22;overflow-wrap:anywhere}.lesson-copy .tag{color:#c9d7ea;font-size:12px;letter-spacing:.07em;font-weight:800;margin-top:5px}.lesson-copy .preview{font-size:13px;line-height:1.3;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{border:1px solid var(--line);border-radius:19px;padding:16px;background:#101b2e}.stat b{display:block;font-size:27px;margin-top:7px}.bottom{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#08101ff5;backdrop-filter:blur(18px);border-top:1px solid #223550}.nav{width:min(100%,620px);margin:auto;display:grid;grid-template-columns:repeat(4,1fr);padding:10px 6px calc(10px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:#94a3bb;display:grid;place-items:center;gap:5px;padding:5px 2px;font-size:12px}.nav button i{font-size:18px;font-style:normal}.nav button.active{color:var(--lime)}.toast{position:fixed;z-index:10;top:15px;left:50%;transform:translate(-50%,-120px);max-width:calc(100% - 30px);background:#ecffd4;color:#14200a;border-radius:15px;padding:13px 16px;font-weight:850;box-shadow:0 14px 40px #0008;transition:transform .25s ease}.toast.show{transform:translate(-50%,0)}.empty{padding:18px;border:1px dashed #4e668a;border-radius:17px;margin-top:16px}.hidden{display:none!important}@media(max-width:390px){.app{padding-left:13px;padding-right:13px}.top{margin-bottom:19px}.english{font-size:31px}.lesson-steps{grid-template-columns:repeat(2,1fr)}.lesson-row{grid-template-columns:45px minmax(0,1fr);padding:14px}.lesson-row .chip{grid-column:2;justify-self:start}.number{width:45px;height:45px}.two,.lesson-nav{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="toast" id="toast" role="status"></div>
<div class="app" id="app"></div>
<nav class="bottom" aria-label="Навигация">
  <div class="nav">
    <button data-nav="today"><i>●</i><span>Сегодня</span></button>
    <button data-nav="course"><i>▤</i><span>Курс</span></button>
    <button data-nav="progress"><i>◌</i><span>Прогресс</span></button>
    <button data-nav="profile"><i>☺</i><span>Профиль</span></button>
  </div>
</nav>
<script src="lessons.js"></script>
<script>
(function(){
  var lessons=window.SAYGO_LESSONS||[];
  var saved=JSON.parse(localStorage.getItem('saygo-v2-done')||'[]');
  var state={tab:'today',current:0,done:new Set(saved),quiz:false,built:false,words:[],soundAnswers:{},spoken:false,listened:false,speechReport:''};
  var app=document.getElementById('app');
  var toastTimer;
  function $(s){return document.querySelector(s)}
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function toast(text){var e=$('#toast');e.textContent=text;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){e.classList.remove('show')},3200)}
  function day(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function progress(){return Math.round(state.done.size/lessons.length*100)}
  function nextIndex(){for(var i=0;i<lessons.length;i++)if(!state.done.has(i))return i;return lessons.length-1}
  function save(){localStorage.setItem('saygo-v2-done',JSON.stringify(Array.from(state.done)));localStorage.setItem('saygo-v2-last-day',day())}
  function header(){return '<header class="top"><div class="brand"><span class="mark">S</span><span>SAYGO</span></div><span class="release">NRV · курс A0 → A1</span></header>'}
  function nav(){document.querySelectorAll('[data-nav]').forEach(function(b){b.classList.toggle('active',b.dataset.nav===state.tab)})}
  function listenText(l){return state.listened?'Образец был включён. Повтори его короткими частями.':'Сначала послушай образец, затем повтори его своими словами.'}
  function renderToday(){
    var l=lessons[state.current],done=state.done.has(state.current),pct=progress();
    var isSound=l.practiceType==='sound';
    var buildWords=l.build||[];
    var builtText=state.words.join(' ');
    var stepOne=state.listened?'done':'';
    var stepTwo=state.built?'done':'';
    var stepThree=state.quiz?'done':'';
    var completeReady=state.built&&state.quiz;
    var html=header();
    html+='<section class="hero"><div class="eyebrow"><i class="dot"></i>ТВОЙ ЛИЧНЫЙ УЧИТЕЛЬ АНГЛИЙСКОГО</div><h1>Говори<br>понятно.</h1><p class="intro">Коротко объясняю по‑русски, даю фразу, тренирую и веду к следующему шагу.</p></section>';
    html+='<section class="summary"><div class="row"><span class="muted">Твой путь</span><b>'+state.done.size+' из '+lessons.length+' уроков</b></div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="row small muted"><span>Сейчас: урок '+(state.current+1)+'</span><span>'+pct+'%</span></div></section>';
    html+='<article class="card"><div class="row"><div><div class="lesson-meta">УРОК '+String(state.current+1).padStart(2,'0')+' · '+esc(l.tag)+'</div><h2>'+esc(l.title)+'</h2><div class="lesson-position">Шаг '+(state.current+1)+' из '+lessons.length+' · '+esc(l.module)+'</div></div><span class="chip">5–10 МИН</span></div>';
    html+='<div class="material-label">ПО-АНГЛИЙСКИ</div><div class="english">'+esc(l.english)+'</div><div class="material-label">ПО-РУССКИ</div><p class="meaning">'+esc(l.meaning)+'</p><div class="material-label">КАК ЗВУЧИТ ПРИБЛИЗИТЕЛЬНО</div><p class="pronounce">'+esc(l.pronounce)+'</p>';
    html+='<div class="why"><b>Зачем тебе это</b><p>'+esc(l.why)+'</p></div><div class="rule"><b>Объяснение по‑русски</b><p>'+esc(l.rule)+'</p><p class="tip">Подсказка: '+esc(l.tip)+'</p></div>';
    html+='<div class="lesson-steps"><div class="step '+stepOne+'">1. Послушай</div><div class="step '+stepTwo+'">2. Тренируй</div><div class="step '+stepThree+'">3. Ответь</div><div class="step '+(done?'done':'')+'">4. Итог</div></div>';
    html+='<button class="btn" data-action="listen">▶ Слушать английский образец</button><div class="state" id="voiceState">'+esc(listenText(l))+'</div>';
    if(isSound){
      html+='<section class="practice"><h3>'+esc(l.practiceTitle)+'</h3><p>'+esc(l.practiceHint)+'</p>';
      l.soundItems.forEach(function(item,itemIndex){
        var selected=state.soundAnswers[itemIndex];
        html+='<div class="sound-card"><b>'+esc(item.word)+'</b><div class="sound-meaning">По-русски: '+esc(item.meaning)+'</div><div class="sound-options">';
        item.options.forEach(function(option,optionIndex){html+='<button class="sound-option '+(selected===optionIndex?'selected':'')+'" data-sound="'+itemIndex+'|'+optionIndex+'">'+esc(option)+'</button>'});
        html+='</div></div>';
      });
      html+='<div class="two"><button class="btn" data-action="clear-sound">Очистить</button><button class="btn" data-action="check-sound">Проверить</button></div><div class="state '+(state.built?'good':'')+'" id="buildState">'+(state.built?'Верно. Ты сопоставил звуки и слова.':'')+'</div></section>';
    }else{
      html+='<section class="practice"><h3>'+esc(l.practiceTitle||'Собери фразу')+'</h3><p>'+esc(l.practiceHint||'Нажимай по одному слову. Если ошибся — очисти и попробуй снова.')+'</p><div class="built '+(builtText?'':'empty')+'">'+(builtText?esc(builtText):'Ответ появится здесь')+'</div><div class="word-bank">';
      buildWords.slice().reverse().forEach(function(w,i){html+='<button class="word" data-word="'+i+'" '+(state.words.indexOf(w)!==-1?'disabled':'')+'>'+esc(w)+'</button>'});
      html+='</div><div class="two"><button class="btn" data-action="clear-build">Очистить</button><button class="btn" data-action="check-build">Проверить</button></div><div class="state '+(state.built?'good':'')+'" id="buildState">'+(state.built?'Верно. Теперь закрепи правило мини-тестом.':'')+'</div></section>';
    }
    html+='<section class="practice"><h3>Мини‑тест</h3><p>'+esc(l.quiz.q)+'</p><div class="choices">';
    l.quiz.options.forEach(function(o,i){html+='<button class="choice" data-quiz="'+i+'">'+esc(o)+'</button>'});
    html+='</div><div class="state" id="quizState">Выбери ответ. Если ошибёшься — разберём сразу.</div></section>';
    html+='<section class="practice"><h3>Скажи — телефон запишет текст</h3><p>Это не оценка акцента. Телефон покажет, какие английские слова он услышал. Микрофон не обязателен для зачёта.</p><button class="btn primary" data-action="speech">● Записать мою фразу</button><div class="state" id="speechState">'+(state.speechReport||'Нажми кнопку, разреши микрофон и произнеси фразу.')+'</div></section>';
    html+='<div class="lesson-done"><b>Итог урока</b><p>'+esc(l.outcome)+'</p></div>';
    html+='<button class="btn primary" data-action="complete" '+((completeReady||done)?'':'disabled')+'>'+ (done?'✓ Урок пройден':'✓ Закончить урок')+'</button>';
    html+='<div class="lesson-nav"><button class="btn" data-action="prev" '+(state.current===0?'disabled':'')+'>← Назад</button><button class="btn" data-action="next" '+(state.current===lessons.length-1?'disabled':'')+'>Следующий урок →</button></div></article>';
    app.innerHTML=html;nav()
  }
  function renderCourse(){
    var html=header()+'<section class="course-head"><div class="eyebrow"><i class="dot"></i>ТВОЙ ПЛАН ОБУЧЕНИЯ</div><h1>Курс<br>по шагам.</h1><p class="intro">Не нужно выбирать наугад. Проходи по порядку: сначала звуки, затем первые разговорные ситуации.</p></section>';
    var module='';
    lessons.forEach(function(l,i){
      if(l.module!==module){module=l.module;html+='<div class="module"><b>'+esc(module)+'</b><span>'+(module.indexOf('СТАРТ')===0?'Учим базу, чтобы не читать английский русскими буквами.':'Применяем основу в реальных коротких фразах.')+'</span></div>'}
      html+='<button class="lesson-row" data-open="'+i+'"><span class="number">'+(state.done.has(i)?'✓':i+1)+'</span><span class="lesson-copy"><strong>'+esc(l.title)+'</strong><span class="tag">'+esc(l.tag)+'</span><span class="preview">'+esc(l.english)+'</span></span><span class="chip">'+(state.done.has(i)?'ГОТОВО':'ОТКРЫТЬ')+'</span></button>'
    });
    html+='<section class="module"><b>ДАЛЬШЕ · УРОКИ 13–60</b><span>Люди, город, поездка, покупки, работа, диалоги и финальное закрепление. Откроем после того, как бесплатный старт станет настоящим курсом, а не витриной.</span></section>';
    app.innerHTML=html;nav()
  }
  function renderProgress(){
    var count=state.done.size,pct=progress(),next=nextIndex();
    var html=header()+'<div class="eyebrow"><i class="dot"></i>ТВОЙ РЕАЛЬНЫЙ РЕЗУЛЬТАТ</div><h1>Прогресс</h1><p class="intro">Засчитываем только завершённые уроки. Никаких нарисованных достижений.</p><div class="stats"><div class="stat"><span class="muted">Пройдено</span><b>'+count+' / '+lessons.length+'</b></div><div class="stat"><span class="muted">Следующий</span><b>'+(count===lessons.length?'Экзамен':'№'+(next+1))+'</b></div></div><section class="summary"><div class="row"><span class="muted">Бесплатный старт</span><b>'+pct+'%</b></div><div class="bar"><i style="width:'+pct+'%"></i></div><p class="small">Сначала закрепим 12 уроков. Затем появится итоговый экзамен из 20 заданий.</p></section>';
    if(count<lessons.length){html+='<section class="exam"><div class="eyebrow">ИТОГОВЫЙ ЭКЗАМЕН</div><h2>Пока рано.</h2><p>Осталось '+(lessons.length-count)+' уроков. Экзамен должен проверять знания, а не быть кнопкой для вида.</p><button class="btn primary" data-action="go-next">Продолжить урок '+(next+1)+'</button></section>'}
    else{html+='<section class="exam"><div class="eyebrow">ИТОГОВЫЙ ЭКЗАМЕН</div><h2>Старт пройден.</h2><p>Экзамен из 20 заданий — следующий обязательный этап. Его добавляем вместе с разбором ошибок, а не пустой кнопкой.</p></section>'}
    app.innerHTML=html;nav()
  }
  function renderProfile(){
    var last=localStorage.getItem('saygo-v2-last-day'),html=header()+'<div class="eyebrow"><i class="dot"></i>НАСТРОЙКИ ОБУЧЕНИЯ</div><h1>Профиль</h1><p class="intro">Данные хранятся на этом телефоне. Ничего не отправляем без твоего согласия.</p><section class="card"><div class="row"><span class="muted">Уровень сейчас</span><b>A0 · старт</b></div><hr><div class="row"><span class="muted">Пройдено уроков</span><b>'+state.done.size+'</b></div><hr><div class="row"><span class="muted">Дневная цель</span><b>5–10 минут</b></div><hr><div class="row"><span class="muted">Последнее занятие</span><b>'+(last||'ещё не начато')+'</b></div></section><section class="card"><div class="eyebrow">ДОСТУП</div><h2>12 уроков бесплатно</h2><p>Полный курс, NRV Club и оплата появятся только вместе с настоящей проверкой доступа. Пока мы не рисуем неработающие кнопки.</p></section>';
    app.innerHTML=html;nav()
  }
  function render(){if(state.tab==='course')renderCourse();else if(state.tab==='progress')renderProgress();else if(state.tab==='profile')renderProfile();else renderToday()}
  function clean(s){return String(s).toLowerCase().replace(/[’']/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim()}
  function doListen(){
    var l=lessons[state.current],box=$('#voiceState'),synth=window.speechSynthesis;
    if(!synth){box.className='state bad';box.textContent='На этом устройстве недоступен синтез речи. В Android: Настройки → Спец. возможности → Синтез речи → скачай English (United States).';return}
    function speak(){var voices=synth.getVoices(),u=new SpeechSynthesisUtterance(l.english);state.listened=true;u.lang='en-US';u.rate=.78;u.pitch=1;u.voice=voices.find(function(v){return /Google US English|Microsoft.*English|Samantha/i.test(v.name)})||voices.find(function(v){return v.lang==='en-US'})||voices.find(function(v){return v.lang.indexOf('en')===0})||null;synth.cancel();synth.speak(u);box.className='state good';box.textContent='Голос включён. Послушай 2–3 раза, затем повтори короткими частями.'}
    if(synth.getVoices().length)speak();else{box.textContent='Загружаю голос телефона…';synth.onvoiceschanged=speak;setTimeout(speak,700)}
  }
  function doSpeech(){
    var Recognition=window.SpeechRecognition||window.webkitSpeechRecognition,box=$('#speechState'),l=lessons[state.current];
    if(!Recognition){box.className='state bad';box.textContent='Chrome на этом телефоне не дал распознавание речи. Урок можно закончить через практику и тест, а речь повтори позже.';return}
    var rec=new Recognition();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=1;box.className='state';box.textContent='Слушаю. Произнеси: '+l.english;
    rec.onresult=function(e){var heard=e.results[0][0].transcript,need=clean(l.english).split(' '),got=clean(heard).split(' '),matched=need.filter(function(w){return got.indexOf(w)!==-1}),missing=need.filter(function(w){return got.indexOf(w)===-1}),score=Math.round(matched.length/need.length*100);state.spoken=true;state.speechReport='<b>Телефон услышал:</b> '+esc(heard)+'<br><b>Совпало:</b> '+esc(matched.join(', ')||'пока нет')+'<br><b>Повтори:</b> '+esc(missing.join(', ')||'всё хорошо')+'<br><b>Результат:</b> '+score+'%';box.className=score>=70?'state good':'state bad';box.innerHTML=state.speechReport;renderToday()};
    rec.onerror=function(e){box.className='state bad';box.textContent=e.error==='not-allowed'?'Разреши микрофон в Chrome для SAYGO. Без него урок всё равно можно пройти через тест и практику.':'Речь не распознана. Проверь интернет и попробуй ещё раз.'};
    try{rec.start()}catch(e){box.className='state bad';box.textContent='Не удалось включить микрофон. Попробуй ещё раз через пару секунд.'}
  }
  document.addEventListener('click',function(e){
    var navBtn=e.target.closest('[data-nav]');if(navBtn){state.tab=navBtn.dataset.nav;render();window.scrollTo(0,0);return}
    var open=e.target.closest('[data-open]');if(open){state.current=Number(open.dataset.open);state.tab='today';state.quiz=false;state.built=false;state.words=[];state.soundAnswers={};state.spoken=false;state.listened=false;state.speechReport='';render();window.scrollTo(0,0);return}
    var sound=e.target.closest('[data-sound]');if(sound){var parts=sound.dataset.sound.split('|'),itemIndex=Number(parts[0]),optionIndex=Number(parts[1]);state.soundAnswers[itemIndex]=optionIndex;state.built=false;renderToday();return}
    var word=e.target.closest('[data-word]');if(word){var all=(lessons[state.current].build||[]).slice().reverse(),w=all[Number(word.dataset.word)];state.words.push(w);render();return}
    var q=e.target.closest('[data-quiz]');if(q){var l=lessons[state.current],choice=Number(q.dataset.quiz),box=$('#quizState');document.querySelectorAll('[data-quiz]').forEach(function(b){b.classList.remove('correct','wrong')});if(choice===l.quiz.answer){q.classList.add('correct');state.quiz=true;box.className='state good';box.textContent='Верно. '+l.quiz.explain}else{q.classList.add('wrong');state.quiz=false;box.className='state bad';box.textContent='Пока не так. Верный ответ: '+l.quiz.options[l.quiz.answer]+'. '+l.quiz.explain}return}
    var action=e.target.closest('[data-action]');if(!action)return;
    if(action.dataset.action==='listen')doListen();
    if(action.dataset.action==='clear-build'){state.words=[];state.built=false;renderToday()}
    if(action.dataset.action==='clear-sound'){state.soundAnswers={};state.built=false;renderToday()}
    if(action.dataset.action==='check-build'){var target=(lessons[state.current].build||[]).join(' ').toLowerCase(),actual=state.words.join(' ').toLowerCase(),box=$('#buildState');state.built=target===actual;box.className=state.built?'state good':'state bad';box.textContent=state.built?'Верно. Теперь закрепи правило мини‑тестом.':'Порядок пока неверный. Нажми «Очистить» и попробуй снова.';if(state.built)renderToday()}
    if(action.dataset.action==='check-sound'){var items=lessons[state.current].soundItems||[],ok=items.length>0&&items.every(function(item,i){return state.soundAnswers[i]===item.answer}),soundBox=$('#buildState');state.built=ok;soundBox.className=ok?'state good':'state bad';soundBox.textContent=ok?'Верно. Теперь закрепи правило мини-тестом.':'Пока не всё верно. Прочитай подсказку и попробуй снова.';if(ok)renderToday()}
    if(action.dataset.action==='speech')doSpeech();
    if(action.dataset.action==='complete'){if(!state.built||!state.quiz){toast('Сначала собери фразу и ответь на мини‑тест.');return}state.done.add(state.current);save();toast('Урок '+(state.current+1)+' сохранён. Хорошая работа.');renderToday()}
    if(action.dataset.action==='next'){if(state.current<lessons.length-1){state.current++;state.quiz=false;state.built=false;state.words=[];state.soundAnswers={};state.spoken=false;state.listened=false;state.speechReport='';renderToday();window.scrollTo(0,0)}}
    if(action.dataset.action==='prev'){if(state.current>0){state.current--;state.quiz=false;state.built=false;state.words=[];state.soundAnswers={};state.spoken=false;state.listened=false;state.speechReport='';renderToday();window.scrollTo(0,0)}}
    if(action.dataset.action==='go-next'){state.current=nextIndex();state.tab='today';state.quiz=false;state.built=false;state.words=[];state.soundAnswers={};state.spoken=false;state.listened=false;state.speechReport='';render();window.scrollTo(0,0)}
  });
  if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(list){list.forEach(function(reg){reg.unregister()})})}
  state.current=nextIndex();render()
})();
</script>
