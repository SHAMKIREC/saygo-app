<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08101f">
<title>SAYGO — разговорный английский</title>
<style>
:root{--bg:#08101f;--panel:#101c31;--panel2:#14233b;--line:#314663;--text:#f4f7fc;--muted:#a8b5ca;--lime:#c7ff00;--lime2:#e7ff80;--danger:#ff7587;--good:#5ce0a0}*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 85% -10%,#1a3e72 0,transparent 34rem),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100%}button{font:inherit}button:enabled{cursor:pointer}.app{width:min(100%,620px);margin:0 auto;padding:18px 16px calc(104px + env(safe-area-inset-bottom));min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.1em}.mark{height:39px;width:39px;border:1px solid var(--lime);border-radius:13px;display:grid;place-items:center;color:var(--lime);font-size:22px}.release{color:var(--muted);font-size:12px;border:1px solid var(--line);padding:8px 10px;border-radius:11px}.eyebrow{display:flex;align-items:center;gap:8px;color:var(--lime);font-size:12px;letter-spacing:.13em;font-weight:900}.dot{height:8px;width:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 15px var(--lime)}h1{font-size:clamp(38px,11vw,56px);line-height:.96;letter-spacing:-.065em;margin:15px 0 18px}h2{font-size:clamp(28px,8vw,37px);letter-spacing:-.055em;line-height:1.02;margin:7px 0 10px}h3{font-size:17px;margin:0 0 9px}p{margin:0;color:var(--muted);line-height:1.52}.hero{padding:9px 0 20px}.intro{font-size:18px;max-width:32ch}.card,.summary,.module,.exam{background:linear-gradient(135deg,var(--panel2),var(--panel) 74%);border:1px solid var(--line);border-radius:24px;padding:20px;margin-top:16px;box-shadow:0 16px 40px #0003}.summary{padding:17px}.row{display:flex;align-items:center;justify-content:space-between;gap:11px}.muted{color:var(--muted)}.small{font-size:13px}.bar{height:10px;background:#263a59;border-radius:100px;overflow:hidden;margin:12px 0 9px}.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--lime),var(--lime2));transition:width .3s ease}.lesson-meta{font-size:12px;font-weight:900;color:var(--lime);letter-spacing:.11em}.lesson-position{font-size:13px;color:var(--muted);margin-top:6px}.chip{border:1px solid #496181;color:#ced9eb;border-radius:12px;padding:8px 10px;white-space:nowrap;font-weight:800;font-size:12px}.material-label{margin-top:18px;color:var(--lime);font-size:11px;font-weight:900;letter-spacing:.12em}.english{font-size:clamp(30px,9vw,45px);font-weight:900;letter-spacing:-.055em;line-height:1.07;margin:7px 0 8px;overflow-wrap:anywhere}.meaning{font-size:19px}.pronounce{margin-top:7px;color:#d8e1ee;font-weight:650;font-size:15px}.sound-card{margin-top:12px;padding:13px;border:1px solid #2b405f;border-radius:14px;background:#0c1728}.sound-card b{font-size:18px}.sound-meaning{margin-top:3px;font-size:13px;color:var(--muted)}.sound-options{display:grid;gap:7px;margin-top:10px}.sound-option{border:1px solid #3b5171;background:#111d31;color:var(--text);border-radius:11px;padding:11px;text-align:left;font-weight:750}.sound-option.selected{border-color:var(--lime);box-shadow:inset 0 0 0 1px var(--lime);color:var(--lime)}.why,.rule{margin-top:16px;padding:14px 15px;border-radius:16px;background:#0b1525;border:1px solid #293e5e}.why b,.rule b{display:block;color:var(--text);margin-bottom:4px}.rule{border-left:3px solid var(--lime)}.tip{margin-top:11px;font-size:14px}.btn{appearance:none;width:100%;border:1px solid #46607f;border-radius:16px;background:#122037;color:var(--text);font-weight:850;padding:16px;text-align:center;min-height:54px}.btn:disabled{opacity:.46}.btn.primary:disabled{opacity:1;background:#1d2b42;color:#8fa0b8;border:1px solid #415775;box-shadow:none}.btn.primary{border:0;background:var(--lime);color:#10170b;box-shadow:0 10px 26px #c7ff0035}.btn.danger{border-color:#8b4d61;color:#ffdce2}.btn+.btn{margin-top:9px}.lesson-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:15px 0}.step{font-size:11px;line-height:1.2;text-align:center;padding:9px 4px;border-radius:11px;background:#0c1728;border:1px solid #2b405f;color:var(--muted)}.step.done{color:#122008;background:var(--lime);border-color:var(--lime);font-weight:850}.state{margin:11px 0 0;padding:13px;border-radius:14px;background:#0a1627;border:1px solid #2c4160;font-size:14px}.state.good{border-color:#4aa778;background:#10291f}.state.bad{border-color:#a65466;background:#2c1720}.practice{padding-top:17px;margin-top:17px;border-top:1px solid #2d405e}.choices{display:grid;gap:8px;margin-top:11px}.choice{width:100%;text-align:left;border:1px solid #3b5171;background:#111d31;color:var(--text);padding:13px;border-radius:13px}.choice.correct{border-color:#58b47a;background:#122b20}.choice.wrong{border-color:#b35b6d;background:#2c1720}.word-bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.word{background:#1b2d47;color:#f3f8ff;border:1px solid #4a6385;padding:10px 12px;border-radius:11px;font-weight:800}.built{min-height:48px;padding:12px;border:1px dashed #60789f;border-radius:13px;color:#d6dfef;margin-top:11px}.built.empty{color:#8fa0b9}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.lesson-done{margin-top:24px;margin-bottom:16px;padding:17px;border-radius:16px;background:#0c1728;border:1px solid #416b59}.lesson-done b{display:block;margin-bottom:7px;color:var(--lime);font-size:18px}.lesson-done p{margin:0;line-height:1.5;color:#d5dfef}.complete-btn{margin-top:0}.lesson-row:disabled{opacity:.52;filter:saturate(.55);cursor:not-allowed}.lesson-nav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.course-head{margin:4px 0 20px}.module{padding:14px 15px;border-radius:17px;margin-top:22px;background:#0d1829}.module b{display:block;font-size:13px;letter-spacing:.08em;color:var(--lime)}.module span{font-size:13px;color:var(--muted);display:block;margin-top:4px}.lesson-row{width:100%;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:19px;padding:15px;background:#111d31;color:var(--text);margin-top:10px}.number{width:48px;height:48px;display:grid;place-items:center;background:#243755;border-radius:14px;font-size:19px}.lesson-copy{min-width:0}.lesson-copy strong,.lesson-copy span{display:block}.lesson-copy strong{line-height:1.22;overflow-wrap:anywhere}.lesson-copy .tag{color:#c9d7ea;font-size:12px;letter-spacing:.07em;font-weight:800;margin-top:5px}.lesson-copy .preview{font-size:13px;line-height:1.3;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{border:1px solid var(--line);border-radius:19px;padding:16px;background:#101b2e}.stat b{display:block;font-size:27px;margin-top:7px}.bottom{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#08101ff5;backdrop-filter:blur(18px);border-top:1px solid #223550}.nav{width:min(100%,620px);margin:auto;display:grid;grid-template-columns:repeat(4,1fr);padding:10px 6px calc(10px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:#94a3bb;display:grid;place-items:center;gap:5px;padding:5px 2px;font-size:12px}.nav button i{font-size:18px;font-style:normal}.nav button.active{color:var(--lime)}.toast{position:fixed;z-index:10;top:15px;left:50%;transform:translate(-50%,-120px);max-width:calc(100% - 30px);background:#ecffd4;color:#14200a;border-radius:15px;padding:13px 16px;font-weight:850;box-shadow:0 14px 40px #0008;transition:transform .25s ease}.toast.show{transform:translate(-50%,0)}.empty{padding:18px;border:1px dashed #4e668a;border-radius:17px;margin-top:16px}.hidden{display:none!important}@media(max-width:390px){.app{padding-left:13px;padding-right:13px}.top{margin-bottom:19px}.english{font-size:31px}.lesson-steps{grid-template-columns:repeat(2,1fr)}.lesson-row{grid-template-columns:45px minmax(0,1fr);padding:14px}.lesson-row .chip{grid-column:2;justify-self:start}.number{width:45px;height:45px}.two,.lesson-nav{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="toast" id="toast" role="status"></div>
<div class="app" id="app"></div>
<nav class="bottom" aria-label="Навигация">
  <div class="nav">
    <button data-nav="today"><i>●</i><span>Сегодня</span></button>
    <button data-nav="course"><i>▤</i><span>Курс</span></button>
    <button data-nav="progress"><i>◌</i><span>Прогресс</span></button>
    <button data-nav="profile"><i>☺</i><span>Профиль</span></button>
  </div>
</nav>
<script src="lessons.js"></script>
<script>
(function(){
  var lessons=window.SAYGO_LESSONS||[];
  var saved=JSON.parse(localStorage.getItem('saygo-v2-done')||'[]');
  var examSaved=JSON.parse(localStorage.getItem('saygo-v2-exam')||'null');
  var examQuestions=[
    {lesson:0,area:'Алфавит',q:'Как называется буква E?',o:['и','эй','э'],a:0,x:'E называется «и».'},
    {lesson:1,area:'Алфавит',q:'Как называется буква J?',o:['джей','джи','йот'],a:0,x:'J называется «джей».'},
    {lesson:2,area:'Алфавит',q:'Как называется буква W?',o:['дабл-ю','ви','дубль-вэ'],a:0,x:'W называется «дабл-ю».'},
    {lesson:3,area:'Звуки',q:'Как ближе всего звучит cat?',o:['кэт','кат','кит'],a:0,x:'В cat буква a даёт звук /æ/, он ближе к «э».'},
    {lesson:3,area:'Звуки',q:'Какой звук главный в слове sit?',o:['i — /ɪ/','e — /e/','a — /æ/'],a:0,x:'В sit короткий звук i — /ɪ/.'},
    {lesson:3,area:'Звуки',q:'Что означает слово bed?',o:['кровать','кошка','чашка'],a:0,x:'bed — кровать.'},
    {lesson:4,area:'Произношение',q:'Как сделать TH в think?',o:['язык чуть между зубами и воздух вперёд','как русское «с»','как русское «в»'],a:0,x:'Для TH кончик языка чуть между зубами, воздух идёт вперёд.'},
    {lesson:4,area:'Произношение',q:'Чем нельзя заменять TH в think?',o:['русским «с»','воздухом вперёд','тренировкой перед зеркалом'],a:0,x:'TH — не русское «с», «з» и не «в».'},
    {lesson:5,area:'Произношение',q:'Как начинается W в слове we?',o:['губы трубочкой, без «в»','как русское «в»','как «ф»'],a:0,x:'W начинается округлёнными губами, без русского «в».'},
    {lesson:5,area:'Фраза',q:'Как по-английски «Мы хотим воды»?',o:['We want water.','We are water.','I want we.'],a:0,x:'We want water. — «Мы хотим воды».'},
    {lesson:6,area:'Знакомство',q:'Что означает I’m?',o:['я','ты','привет'],a:0,x:'I’m = I am. В знакомстве это «я».'},
    {lesson:6,area:'Знакомство',q:'Выбери правильное знакомство.',o:['Hello, I’m Rustam.','Hello, you Rustam.','I’m hello Rustam.'],a:0,x:'Сначала Hello, затем I’m и имя.'},
    {lesson:7,area:'Разговор',q:'Как начинается вопрос «Как дела?»?',o:['How are you?','You how are?','Are how you?'],a:0,x:'В готовом вопросе: How are you?'},
    {lesson:7,area:'Разговор',q:'Как ответить «Хорошо, спасибо»?',o:['I’m fine, thanks.','I’m help.','Where fine?'],a:0,x:'I’m fine, thanks. — «Хорошо, спасибо».'},
    {lesson:8,area:'Просьба',q:'Что означает need?',o:['нуждаться','идти','помнить'],a:0,x:'need означает «нуждаться».'},
    {lesson:8,area:'Просьба',q:'Как попросить помощь?',o:['I need some help.','I help need.','Need I some.'],a:0,x:'В начале английской фразы обычно стоит тот, кому нужна помощь: I.'},
    {lesson:9,area:'Дорога',q:'Какое слово означает «где»?',o:['Where','What','When'],a:0,x:'Where означает «где».'},
    {lesson:9,area:'Дорога',q:'Как спросить «Где станция?»',o:['Where is the station?','Where the station is?','Station where?'],a:0,x:'Сначала Where, затем is, затем место.'},
    {lesson:10,area:'Кафе',q:'Какая просьба звучит вежливее?',o:['I would like water.','I want water.','Water me.'],a:0,x:'I would like… — мягкое и вежливое «я бы хотел».'},
    {lesson:11,area:'Итог',q:'Что было сначала в курсе?',o:['буквы и звуки','сложные времена','длинные диалоги'],a:0,x:'Сначала фундамент: буквы, звуки и чтение. Потом фразы.'}
  ];
  var state={tab:'today',current:0,done:new Set(saved),quiz:false,built:false,words:[],soundAnswers:{},spoken:false,listened:false,speechReport:'',examStep:0,examAnswers:[],examResult:examSaved};
  var app=document.getElementById('app');
  var toastTimer;
  function $(s){return document.querySelector(s)}
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function toast(text){var e=$('#toast');e.textContent=text;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){e.classList.remove('show')},3200)}
  function day(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function completedInOrder(){var i=0;while(i<lessons.length&&state.done.has(i))i++;return i}
  function progress(){return Math.round(completedInOrder()/lessons.length*100)}
  function nextIndex(){var next=completedInOrder();return next>=lessons.length?lessons.length-1:next}
  function save(){localStorage.setItem('saygo-v2-done',JSON.stringify(Array.from(state.done)));localStorage.setItem('saygo-v2-last-day',day())}
  function header(){return '<header class="top"><div class="brand"><span class="mark">S</span><span>SAYGO</span></div><span class="release">NRV · курс A0 → A1</span></header>'}
  function nav(){document.querySelectorAll('[data-nav]').forEach(function(b){b.classList.toggle('active',b.dataset.nav===state.tab)})}
  function listenText(l){return state.listened?'Образец был включён. Повтори его короткими частями.':'Сначала послушай образец, затем повтори его своими словами.'}
  function renderToday(){
    var l=lessons[state.current],done=state.done.has(state.current),pct=progress(),completed=completedInOrder();
    var isSound=l.practiceType==='sound';
    var buildWords=l.build||[];
    var builtText=state.words.join(' ');
    var stepOne=state.listened?'done':'';
    var stepTwo=state.built?'done':'';
    var stepThree=state.quiz?'done':'';
    var completeReady=state.built&&state.quiz;
    var html=header();
    html+='<section class="hero"><div class="eyebrow"><i class="dot"></i>ТВОЙ ЛИЧНЫЙ УЧИТЕЛЬ АНГЛИЙСКОГО</div><h1>Говори<br>понятно.</h1><p class="intro">Коротко объясняю по‑русски, даю фразу, тренирую и веду к следующему шагу.</p></section>';
    html+='<section class="summary"><div class="row"><span class="muted">Твой путь</span><b>'+completed+' из '+lessons.length+' уроков</b></div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="row small muted"><span>Сейчас: урок '+(state.current+1)+'</span><span>'+pct+'%</span></div></section>';
    html+='<article class="card"><div class="row"><div><div class="lesson-meta">УРОК '+String(state.current+1).padStart(2,'0')+' · '+esc(l.tag)+'</div><h2>'+esc(l.title)+'</h2><div class="lesson-position">Шаг '+(state.current+1)+' из '+lessons.length+' · '+esc(l.module)+'</div></div><span class="chip">5–10 МИН</span></div>';
    html+='<div class="material-label">ПО-АНГЛИЙСКИ</div><div class="english">'+esc(l.english)+'</div><div class="material-label">ПО-РУССКИ</div><p class="meaning">'+esc(l.meaning)+'</p><div class="material-label">КАК ЗВУЧИТ ПРИБЛИЗИТЕЛЬНО</div><p class="pronounce">'+esc(l.pronounce)+'</p>';
    html+='<div class="why"><b>Зачем тебе это</b><p>'+esc(l.why)+'</p></div><div class="rule"><b>Объяснение по‑русски</b><p>'+esc(l.rule)+'</p><p class="tip">Подсказка: '+esc(l.tip)+'</p></div>';
    html+='<div class="lesson-steps"><div class="step '+stepOne+'">1. Послушай</div><div class="step '+stepTwo+'">2. Тренируй</div><div class="step '+stepThree+'">3. Ответь</div><div class="step '+(done?'done':'')+'">4. Итог</div></div>';
    html+='<button class="btn" data-action="listen">▶ Слушать английский образец</button><div class="state" id="voiceState">'+esc(listenText(l))+'</div>';
    if(isSound){
      html+='<section class="practice"><h3>'+esc(l.practiceTitle)+'</h3><p>'+esc(l.practiceHint)+'</p>';
      l.soundItems.forEach(function(item,itemIndex){
        var selected=state.soundAnswers[itemIndex];
        html+='<div class="sound-card"><b>'+esc(item.word)+'</b><div class="sound-meaning">По-русски: '+esc(item.meaning)+'</div><div class="sound-options">';
        item.options.forEach(function(option,optionIndex){html+='<button class="sound-option '+(selected===optionIndex?'selected':'')+'" data-sound="'+itemIndex+'|'+optionIndex+'">'+esc(option)+'</button>'});
        html+='</div></div>';
      });
      html+='<div class="two"><button class="btn" data-action="clear-sound">Очистить</button><button class="btn" data-action="check-sound">Проверить</button></div><div class="state '+(state.built?'good':'')+'" id="buildState">'+(state.built?'Верно. Ты сопоставил звуки и слова.':'')+'</div></section>';
    }else{
      html+='<section class="practice"><h3>'+esc(l.practiceTitle||'Собери фразу')+'</h3><p>'+esc(l.practiceHint||'Нажимай по одному слову. Если ошибся — очисти и попробуй снова.')+'</p><div class="built '+(builtText?'':'empty')+'">'+(builtText?esc(builtText):'Ответ появится здесь')+'</div><div class="word-bank">';
      buildWords.slice().reverse().forEach(function(w,i){html+='<button class="word" data-word="'+i+'" '+(state.words.indexOf(w)!==-1?'disabled':'')+'>'+esc(w)+'</button>'});
      html+='</div><div class="two"><button class="btn" data-action="clear-build">Очистить</button><button class="btn" data-action="check-build">Проверить</button></div><div class="state '+(state.built?'good':'')+'" id="buildState">'+(state.built?'Верно. Теперь закрепи правило мини-тестом.':'')+'</div></section>';
    }
    html+='<section class="practice"><h3>Мини‑тест</h3><p>'+esc(l.quiz.q)+'</p><div class="choices">';
    l.quiz.options.forEach(function(o,i){html+='<button class="choice" data-quiz="'+i+'">'+esc(o)+'</button>'});
    html+='</div><div class="state" id="quizState">Выбери ответ. Если ошибёшься — разберём сразу.</div></section>';
    html+='<section class="practice"><h3>Голосовая попытка</h3><p>Телефон покажет, какие слова услышал. Это тренировка речи, а не оценка акцента; микрофон не влияет на зачёт.</p><button class="btn primary" data-action="speech">● Сказать фразу</button><div class="state" id="speechState">'+(state.speechReport||'Нажми кнопку, разреши микрофон и произнеси английскую фразу.')+'</div></section>';
    html+='<div class="lesson-done"><b>Итог урока</b><p>'+esc(l.outcome)+'</p></div>';
    html+='<button class="btn primary complete-btn" data-action="complete" '+((completeReady||done)?'':'disabled')+'>'+ (done?'✓ Урок пройден':completeReady?'✓ Закончить урок':'Сначала заверши тренировку и тест')+'</button>';
    html+='<div class="lesson-nav"><button class="btn" data-action="prev" '+(state.current===0?'disabled':'')+'>← Назад</button><button class="btn" data-action="next" '+(state.current===lessons.length-1?'disabled':'')+'>Следующий урок →</button></div></article>';
    app.innerHTML=html;nav()
  }
  function renderCourse(){
    var html=header()+'<section class="course-head"><div class="eyebrow"><i class="dot"></i>ТВОЙ ПЛАН ОБУЧЕНИЯ</div><h1>Курс<br>по шагам.</h1><p class="intro">Сначала буквы, затем звуки, потом первые фразы. Каждый следующий шаг опирается на предыдущий.</p></section>';
    var module='',notes={'МОДУЛЬ 1 · БУКВЫ И ЗВУКИ':'Учим буквы отдельно от звуков и не читаем английский русскими буквами.','МОДУЛЬ 2 · ПЕРВЫЕ ФРАЗЫ':'Строим короткие жизненные фразы: знакомство, помощь, дорога и кафе.','МОДУЛЬ 3 · ЗАКРЕПЛЕНИЕ':'Проверяем, что основа понятна и получается в реальной фразе.','МОДУЛЬ 4 · ОСНОВА ГРАММАТИКИ':'Разбираем главные правила простыми словами и сразу применяем их в фразах.','МОДУЛЬ 5 · ГОРОД И ПОЕЗДКА':'Учим транспорт, дорогу, отель и время.','МОДУЛЬ 6 · КАФЕ И ПОКУПКИ':'Заказываем, уточняем цену, наличие, размер и оплату.','МОДУЛЬ 7 · ОБЩЕНИЕ КАЖДЫЙ ДЕНЬ':'Просим повторить, объясняем состояние и строим планы.','МОДУЛЬ 8 · РАБОТА И СЕРВИСЫ':'Объясняем задачу, проблему и договариваемся о встрече.','МОДУЛЬ 9 · ЗАКРЕПЛЕНИЕ':'Соединяем всё в короткие реальные диалоги.'},available=nextIndex();
    lessons.forEach(function(l,i){
      if(l.module!==module){module=l.module;html+='<div class="module"><b>'+esc(module)+'</b><span>'+esc(notes[module]||'Последовательный учебный модуль.')+'</span></div>'}
      var unlocked=i<=available,finished=state.done.has(i)&&i<available;
      html+='<button class="lesson-row" '+(unlocked?'data-open="'+i+'"':'disabled')+'><span class="number">'+(finished?'✓':i+1)+'</span><span class="lesson-copy"><strong>'+esc(l.title)+'</strong><span class="tag">ТЕМА: '+esc(l.tag)+'</span><span class="preview">АНГЛИЙСКИЙ: '+esc(l.english)+'</span></span><span class="chip">'+(finished?'ГОТОВО':unlocked?'ОТКРЫТЬ':'ЗАКРЫТО')+'</span></button>'
    });
    html+='<section class="module"><b>КУРС СОБРАН · 60 УРОКОВ</b><span>После прохождения открой «Прогресс»: там стартовый экзамен и честный список того, что повторить.</span></section>';
    app.innerHTML=html;nav()
  }
  function examScore(){return state.examAnswers.reduce(function(sum,answer,index){return sum+(answer===examQuestions[index].a?1:0)},0)}
  function finishExam(){
    var score=examScore(),weak=[];
    examQuestions.forEach(function(question,index){if(state.examAnswers[index]!==question.a&&weak.indexOf(question.lesson)===-1)weak.push(question.lesson)});
    state.examResult={score:score,total:examQuestions.length,weak:weak,date:day()};
    localStorage.setItem('saygo-v2-exam',JSON.stringify(state.examResult));
  }
  function renderExam(){
    var result=state.examResult,html=header();
    if(result){
      var passed=result.score>=16,weakText=result.weak.length?'Нужно повторить: '+result.weak.map(function(i){return 'урок '+(i+1)}).join(', ')+'.':'Ошибок по темам нет.';
      html+='<section class="course-head"><div class="eyebrow"><i class="dot"></i>ИТОГОВЫЙ ЭКЗАМЕН</div><h1>'+result.score+' из '+result.total+'</h1><p class="intro">'+(passed?'Стартовый модуль пройден. Ты не просто нажал карточки — ты прошёл проверку.':'Это нормальный первый результат. Экзамен показывает, что повторить, а не ставит плохую оценку.')+'</p></section><section class="exam"><h2>'+ (passed?'Можно двигаться дальше.':'Сначала закрепим слабое.')+'</h2><p>'+esc(weakText)+'</p><button class="btn primary" data-action="repeat-weak">'+(result.weak.length?'Повторить слабые темы':'Вернуться к курсу')+'</button><button class="btn" data-action="restart-exam">Пройти экзамен ещё раз</button></section>';
    }else{
      var q=examQuestions[state.examStep],answer=state.examAnswers[state.examStep],answered=typeof answer==='number',right=answered&&answer===q.a;
      html+='<section class="course-head"><div class="eyebrow"><i class="dot"></i>ИТОГОВЫЙ ЭКЗАМЕН</div><h1>Проверь<br>старт.</h1><p class="intro">20 коротких вопросов: буквы, звуки, первые фразы. После каждого ответа будет объяснение.</p></section><section class="card"><div class="row"><span class="lesson-meta">ВОПРОС '+(state.examStep+1)+' ИЗ '+examQuestions.length+' · '+esc(q.area)+'</span><span class="chip">'+Math.round(state.examStep/examQuestions.length*100)+'%</span></div><h2>'+esc(q.q)+'</h2><div class="choices">';
      q.o.forEach(function(option,index){html+='<button class="choice '+(answered?(index===q.a?'correct':index===answer?'wrong':''):'')+'" data-exam-option="'+index+'" '+(answered?'disabled':'')+'>'+esc(option)+'</button>'});
      html+='</div><div class="state '+(answered?(right?'good':'bad'):'')+'">'+(answered?(right?'Верно. ':'Пока не так. ')+esc(q.x):'Выбери один вариант. Потом сразу увидишь объяснение.')+'</div><button class="btn primary" data-action="exam-next" '+(answered?'':'disabled')+'>'+ (state.examStep===examQuestions.length-1?'Показать результат':'Следующий вопрос →')+'</button></section>';
    }
    app.innerHTML=html;nav()
  }
  function renderProgress(){
    var count=completedInOrder(),pct=progress(),next=nextIndex(),firstExamReady=count>=12;
    var html=header()+'<div class="eyebrow"><i class="dot"></i>ТВОЙ РЕАЛЬНЫЙ РЕЗУЛЬТАТ</div><h1>Прогресс</h1><p class="intro">Засчитываем только уроки, пройденные по порядку. Никаких нарисованных достижений.</p><div class="stats"><div class="stat"><span class="muted">Пройдено</span><b>'+count+' / '+lessons.length+'</b></div><div class="stat"><span class="muted">Следующий</span><b>'+(count>=lessons.length?'Повторение':'№'+(next+1))+'</b></div></div><section class="summary"><div class="row"><span class="muted">Текущий путь</span><b>'+pct+'%</b></div><div class="bar"><i style="width:'+pct+'%"></i></div><p class="small">После урока 12 открывается стартовый экзамен. Затем продолжается грамматика и реальные ситуации.</p></section>';
    if(!firstExamReady){html+='<section class="exam"><div class="eyebrow">СТАРТОВЫЙ ЭКЗАМЕН</div><h2>Пока рано.</h2><p>Осталось '+(12-count)+' уроков до первой проверки. Она проверит буквы, звуки и первые фразы.</p><button class="btn primary" data-action="go-next">Продолжить урок '+(next+1)+'</button></section>'}
    else{var examText=state.examResult?'Последний результат: '+state.examResult.score+' из '+state.examResult.total+'.':'20 вопросов: буквы, звуки, первые фразы и разбор ошибок.';html+='<section class="exam"><div class="eyebrow">СТАРТОВЫЙ ЭКЗАМЕН</div><h2>Проверь основу.</h2><p>'+esc(examText)+'</p><button class="btn primary" data-action="open-exam">'+(state.examResult?'Открыть результат':'Начать экзамен')+'</button></section>'}
    app.innerHTML=html;nav()
  }
  function renderProfile(){
    var last=localStorage.getItem('saygo-v2-last-day'),html=header()+'<div class="eyebrow"><i class="dot"></i>НАСТРОЙКИ ОБУЧЕНИЯ</div><h1>Профиль</h1><p class="intro">Данные хранятся на этом телефоне. Ничего не отправляем без твоего согласия.</p><section class="card"><div class="row"><span class="muted">Уровень сейчас</span><b>A0 · старт</b></div><hr><div class="row"><span class="muted">Пройдено по порядку</span><b>'+completedInOrder()+'</b></div><hr><div class="row"><span class="muted">Дневная цель</span><b>5–10 минут</b></div><hr><div class="row"><span class="muted">Последнее занятие</span><b>'+(last||'ещё не начато')+'</b></div></section><section class="card"><div class="eyebrow">ДОСТУП</div><h2>Тестовая версия курса</h2><p>Сейчас доступны рабочие уроки 1–60. Оплату и NRV Club подключим только вместе с настоящей проверкой доступа — не будем рисовать неработающие кнопки.</p></section>';
    app.innerHTML=html;nav()
  }
  function render(){if(state.tab==='course')renderCourse();else if(state.tab==='progress')renderProgress();else if(state.tab==='profile')renderProfile();else if(state.tab==='exam')renderExam();else renderToday()}
  function clean(s){return String(s).toLowerCase().replace(/[’']/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim()}
  function doListen(){
    var l=lessons[state.current],box=$('#voiceState'),synth=window.speechSynthesis;
    if(!synth){box.className='state bad';box.textContent='На этом устройстве недоступен синтез речи. В Android: Настройки → Спец. возможности → Синтез речи → скачай English (United States).';return}
    function speak(){var voices=synth.getVoices(),u=new SpeechSynthesisUtterance(l.english);state.listened=true;u.lang='en-US';u.rate=.78;u.pitch=1;u.voice=voices.find(function(v){return /Google US English|Microsoft.*English|Samantha/i.test(v.name)})||voices.find(function(v){return v.lang==='en-US'})||voices.find(function(v){return v.lang.indexOf('en')===0})||null;synth.cancel();synth.speak(u);box.className='state good';box.textContent='Голос включён. Послушай 2–3 раза, затем повтори короткими частями.'}
    if(synth.getVoices().length)speak();else{box.textContent='Загружаю голос телефона…';synth.onvoiceschanged=speak;setTimeout(speak,700)}
  }
  function doSpeech(){
    var Recognition=window.SpeechRecognition||window.webkitSpeechRecognition,box=$('#speechState'),l=lessons[state.current];
    if(!Recognition){box.className='state bad';box.textContent='Chrome на этом телефоне не дал распознавание речи. Урок можно закончить через практику и тест, а речь повтори позже.';return}
    var rec=new Recognition();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=1;box.className='state';box.textContent='Слушаю. Произнеси: '+l.english;
    rec.onresult=function(e){var heard=e.results[0][0].transcript,need=clean(l.english).split(' '),got=clean(heard).split(' '),matched=need.filter(function(w){return got.indexOf(w)!==-1}),missing=need.filter(function(w){return got.indexOf(w)===-1}),score=Math.round(matched.length/need.length*100);state.spoken=true;state.speechReport='<b>Телефон услышал:</b> '+esc(heard)+'<br><b>Совпало:</b> '+esc(matched.join(', ')||'пока нет')+'<br><b>Повтори:</b> '+esc(missing.join(', ')||'всё хорошо')+'<br><b>Результат:</b> '+score+'%';box.className=score>=70?'state good':'state bad';box.innerHTML=state.speechReport;renderToday()};
    rec.onerror=function(e){box.className='state bad';box.textContent=e.error==='not-allowed'?'Разреши микрофон в Chrome для SAYGO. Без него урок всё равно можно пройти через тест и практику.':'Речь не распознана. Проверь интернет и попробуй ещё раз.'};
    try{rec.start()}catch(e){box.className='state bad';box.textContent='Не удалось включить микрофон. Попробуй ещё раз через пару секунд.'}
  }
  document.addEventListener('click',function(e){
    var navBtn=e.target.closest('[data-nav]');if(navBtn){state.tab=navBtn.dataset.nav;render();window.scrollTo(0,0);return}
    var open=e.target.closest('[data-open]');if(open){var wanted=Number(open.dataset.open);if(wanted>nextIndex()){toast('Сначала закончи урок '+(nextIndex()+1)+'.');return}state.current=wanted;state.tab='today';state.quiz=false;state.built=false;state.words=[];state.soundAnswers={};state.spoken=false;state.listened=false;state.speechReport='';render();window.scrollTo(0,0);return}
    var examOption=e.target.closest('[data-exam-option]');if(examOption){state.examAnswers[state.examStep]=Number(examOption.dataset.examOption);renderExam();return}
    var sound=e.target.closest('[data-sound]');if(sound){var parts=sound.dataset.sound.split('|'),itemIndex=Number(parts[0]),optionIndex=Number(parts[1]);state.soundAnswers[itemIndex]=optionIndex;state.built=false;renderToday();return}
    var word=e.target.closest('[data-word]');if(word){var all=(lessons[state.current].build||[]).slice().reverse(),w=all[Number(word.dataset.word)];state.words.push(w);render();return}
    var q=e.target.closest('[data-quiz]');if(q){var l=lessons[state.current],choice=Number(q.dataset.quiz),box=$('#quizState');document.querySelectorAll('[data-quiz]').forEach(function(b){b.classList.remove('correct','wrong')});if(choice===l.quiz.answer){q.classList.add('correct');state.quiz=true;box.className='state good';box.textContent='Верно. '+l.quiz.explain}else{q.classList.add('wrong');state.quiz=false;box.className='state bad';box.textContent='Пока не так. Верный ответ: '+l.quiz.options[l.quiz.answer]+'. '+l.quiz.explain}return}
    var action=e.target.closest('[data-action]');if(!action)return;
    if(action.dataset.action==='open-exam'){if(!state.examResult){state.examStep=0;state.examAnswers=[]}state.tab='exam';render();window.scrollTo(0,0)}
    if(action.dataset.action==='restart-exam'){state.examResult=null;state.examStep=0;state.examAnswers=[];state.tab='exam';render();window.scrollTo(0,0)}
    if(action.dataset.action==='exam-next'){if(typeof state.examAnswers[state.examStep]!=='number'){toast('Сначала выбери ответ.');return}if(state.examStep<examQuestions.length-1){state.examStep++;renderExam();window.scrollTo(0,0)}else{finishExam();renderExam();window.scrollTo(0,0)}}
    if(action.dataset.action==='repeat-weak'){if(state.examResult&&state.examResult.weak.length){state.current=state.examResult.weak[0];state.tab='today';state.quiz=false;state.built=false;state.words=[];state.soundAnswers={};state.spoken=false;state.listened=false;state.speechReport='';render();window.scrollTo(0,0)}else{state.tab='course';render();window.scrollTo(0,0)}}
    if(action.dataset.action==='listen')doListen();
    if(action.dataset.action==='clear-build'){state.words=[];state.built=false;renderToday()}
    if(action.dataset.action==='clear-sound'){state.soundAnswers={};state.built=false;renderToday()}
    if(action.dataset.action==='check-build'){var target=(lessons[state.current].build||[]).join(' ').toLowerCase(),actual=state.words.join(' ').toLowerCase(),box=$('#buildState');state.built=target===actual;box.className=state.built?'state good':'state bad';box.textContent=state.built?'Верно. Теперь закрепи правило мини‑тестом.':'Порядок пока неверный. Нажми «Очистить» и попробуй снова.';if(state.built)renderToday()}
    if(action.dataset.action==='check-sound'){var items=lessons[state.current].soundItems||[],ok=items.length>0&&items.every(function(item,i){return state.soundAnswers[i]===item.answer}),soundBox=$('#buildState');state.built=ok;soundBox.className=ok?'state good':'state bad';soundBox.textContent=ok?'Верно. Теперь закрепи правило мини-тестом.':'Пока не всё верно. Прочитай подсказку и попробуй снова.';if(ok)renderToday()}
    if(action.dataset.action==='speech')doSpeech();
    if(action.dataset.action==='complete'){if(state.current!==nextIndex()&&!state.done.has(state.current)){toast('Сначала закончи урок '+(nextIndex()+1)+'.');return}if(!state.built||!state.quiz){toast('Сначала выполни тренировку и мини‑тест.');return}state.done.add(state.current);save();toast('Урок '+(state.current+1)+' сохранён. Хорошая работа.');renderToday()}
    if(action.dataset.action==='next'){if(!state.done.has(state.current)&&state.current===nextIndex()){toast('Сначала заверши этот урок.');return}if(state.current<nextIndex()){state.current++;state.quiz=false;state.built=false;state.words=[];state.soundAnswers={};state.spoken=false;state.listened=false;state.speechReport='';renderToday();window.scrollTo(0,0)}}
    if(action.dataset.action==='prev'){if(state.current>0){state.current--;state.quiz=false;state.built=false;state.words=[];state.soundAnswers={};state.spoken=false;state.listened=false;state.speechReport='';renderToday();window.scrollTo(0,0)}}
    if(action.dataset.action==='go-next'){state.current=nextIndex();state.tab='today';state.quiz=false;state.built=false;state.words=[];state.soundAnswers={};state.spoken=false;state.listened=false;state.speechReport='';render();window.scrollTo(0,0)}
  });
  if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(list){list.forEach(function(reg){reg.unregister()})})}
  state.current=nextIndex();render()
})();
</script>
</body>
